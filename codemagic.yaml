# Mac olmadan iOS derlemesi: Codemagic bulutta Xcode çalıştırır ve çıktıyı TestFlight'a yükler.
# Gerekenler: Codemagic Integrations'ta "App Store Connect API key" (adı: neresi_burasi_asc) ve
# "ios_signing" değişken grubunda gizli CERTIFICATE_PRIVATE_KEY (RSA özel anahtar, PEM).
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: neresi_burasi_asc
    environment:
      node: 22
      xcode: latest
      groups:
        - ios_signing
      vars:
        APP_STORE_APPLE_ID: "6833857031"
        BUNDLE_ID: "com.neresiburasi.app"
    scripts:
      - name: Bağımlılıkları kur
        script: npm ci
      - name: Capacitor eşitle
        script: npx cap sync ios
      - name: Anahtarlığı hazırla
        script: keychain initialize
      - name: İmza dosyalarını Apple'dan al (yoksa oluştur)
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Sertifikayı anahtarlığa ekle
        script: keychain add-certificates
      - name: İmzalama ayarını uygula
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Derleme numarasını artır
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
